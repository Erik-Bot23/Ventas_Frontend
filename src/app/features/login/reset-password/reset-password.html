<div class="container">

  <div class="card">

    <h2>Nueva contraseña</h2>

    <input
      type="password"
      placeholder="Nueva contraseña"
      [(ngModel)]="password">

    <input
      type="password"
      placeholder="Confirmar contraseña"
      [(ngModel)]="confirmPassword">

    <button (click)="save()">
      Guardar
    </button>

  </div>

</div>
