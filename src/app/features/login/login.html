<div class="login-container">

  <div class="login-card">

    <h2>Iniciar sesión</h2>

    <!--[(ngModel)]: -->
    <input 
      type="text"
      placeholder="Correo electronico"
      [(ngModel)]="email" 
    />

    <input 
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
    />

    <button (click)="submit()">Entrar</button>

  </div>

</div>
