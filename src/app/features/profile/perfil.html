<div class="perfil-container">
  <div class="card" *ngIf="user">

    <div class="avatar">
      👤
    </div>

    <h2>
      {{user.name}}
    </h2>

    <span class="role">
      {{user.role}}
    </span>

    <p>
      <strong>ID:</strong>
      {{user.id}}
    </p>

    <p>
      <strong>Email:</strong>
      {{user.email}}
    </p>

    <div class="actions">
      <button class="change-btn" (click)="togglePasswordForm()">
        Cambiar contraseña
      </button>

      <button class="logout-btn" (click)="logout()">
        Cerrar sesión
      </button>

      <button class="back-btn" (click)="inicio()">
        Regresar
      </button>
    </div>

    <div *ngIf="showPasswordForm" class="password-card">
      <input type="password" placeholder="Contraseña actual" [(ngModel)]="currentPassword">
      <input type="password" placeholder="Nueva contraseña" [(ngModel)]="newPassword">
      <input type="password" placeholder="Confirmar contraseña" [(ngModel)]="confirmPassword">

      <button class="save-btn" (click)="savePassword()">
        Guardar contraseña
      </button>
    </div>
    
  </div>
</div>
