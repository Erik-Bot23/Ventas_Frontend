<div class="perfil-container">
    <h2>Mi perfil</h2>

    <div class="card">
        <p><strong>Nombre:</strong> {{ user.name }} </p>
        <p><strong>Rol:</strong> {{ user.role }} </p>
        <p><strong>Email:</strong> {{ user.email }} </p>
    </div>

    <button class="logout-btn" (click)="logout()">
        Cerrar sesión
    </button>
</div>
