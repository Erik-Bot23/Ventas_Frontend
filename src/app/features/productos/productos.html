<div class="layout" [class.collapsed]="!menuOpen">
  <app-sidebar (toggle)="menuOpen = $event"></app-sidebar>
  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de Productos</h2>

    <div class="main-grid">
      <!-- FORMULARIO -->
    <div class="form-card">
        <div class="field">
          <label>Nombre del producto</label>
          <input [(ngModel)]="form.name" />
        </div>

        <div class="field">
          <label>Precio</label>
          <input 
            [(ngModel)]="form.price"
            min="1"
            (input)="validateNumber('price')"
            type="number"
          />
        </div>

        <div class="field">
          <label>Stock</label>
          <input 
            [(ngModel)]="form.stock"
            min="1"
            (input)="validateNumber('stock')"n
            type="number"
          />
        </div>

        <div class="field">
          <label>Categoría</label>
          <div class="category-row">
            <select [(ngModel)]="form.categoryId" class="custom-select">
              <!--let c of: -->
              <option *ngFor="let c of categories" [value]="c.id"> <!--*ngFor: -->
                {{ c.name }}
              </option>
            </select>

            <button type="button" class="add-category" (click)="categorias()">
              +
            </button>
          </div>
        </div>

        <div class="field">
          <label>SKU</label>
          <input [(ngModel)]="form.sku" />
        </div>

        <div class="field">
          <label>Barcode</label>
          <input [(ngModel)]="form.barcode" />
        </div>

        <div class="field">
          <label>Imagen del producto</label>
          <!--#fileInput: -->
          <!--(change): -->
          <!--$event: -->
          <!--accept: -->
          <input 
            #fileInput 
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="file-input"
          />
        </div>

        <button type="button" (click)="save()" [disabled]="isSaving">
          <!--{{ isSaving ? 'Guardando...' : 'Guardar' }}-->
           <!--?-->
           <!--:-->
           {{ form.id ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>

      <!-- LISTADO -->
      <div *ngIf="loading">
        Cargando productos...
      </div>

      <!--*ngIf: -->
      <div *ngIf="!loading" class="table-container">
        <table class="product-table">
          <thead>
            <tr>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Categoría</th>
              <th>SKU</th>
              <th>Barcode</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let p of products">
              <td><img [src]="p.img" class="img"></td>
              <td>{{ p.name }}</td>
              <td>${{ p.price }}</td>
              <td>{{ p.stock }}</td>
              <td>{{ p.categoryName }}</td>
              <td>{{ p.sku }}</td>
              <td>{{ p.barcode }}</td>
              <td>
                <button type="button" (click)="editProduct(p)" class="edit">Editar</button>
                <button type="button" (click)="deleteProduct(p.id)" class="delete">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
