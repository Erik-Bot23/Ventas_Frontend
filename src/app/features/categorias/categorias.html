<div class="layout" [class.collapsed]="!menuOpen">
  <!-- SIDEBAR reutilizado -->
  <aside class="sidebar">
    <div class="user-box" (click)="perfil()">
      <img src="assets/images/avatar.png">
      <span class="text">Admin</span>
    </div>

    <div class="menu-title" (click)="toggleMenu()">
      ☰ <span class="text">Menú</span>
    </div>

    <!--Navegación-->
    <nav class="nav">
      <!--Esta es la página de cobro-->
      <a (click)="inicio()">
        <span class="text">Inicio</span>
      </a>
      <a (click)="productos()">
        <span class="text">Productos</span>
      </a>
      <a (click)="categorias()">
        <span class="text">Categorias</span>
      </a>
      <a routerLink="/ventas">
        <span class="text">Ventas</span>
      </a>
      <a routerLink="/compras">
        <span class="text">Compras</span>
      </a>
      <a routerLink="/facturas">
        <span class="text">Facturas</span>
      </a>
      <a routerLink="/reportes">
        <span class="text">Reportes</span>
      </a>
      <a routerLink="/caja">
        <span class="text">Caja</span>
      </a>
      <a routerLink="/cliente">
        <span class="text">Clientes</span>
      </a>
      <a (click)="usuarios()">
        <span class="text">Usuarios</span>
      </a>
    </nav>
  </aside>

  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de categorías</h2>

        <!--Formulario-->
        <div class="form-card">
            <div class="field">
                <label>Nombre de la categoría</label>
                <input [(ngModel)]="categoryName">
            </div>

            <button (click)="saveCategory()">Guardar</button>
        </div>

        <div class="table-container">
            <table>
                <tr>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>

                <tr *ngFor="let c of categories">
                    <td>{{ c.name }}</td>
                    <td>
                        <button (click)="deleteCategory(c.id)" class="delete">
                            Eliminar
                        </button>
                    </td>
                </tr>
            </table>
        </div> 
  </main>
</div>

































<h2>Gestión de categorías</h2>

<div class="form-card">
    <div class="field">
        <label>Nombre de la categoría</label>
        <input [(ngModel)]="categoryName">
    </div>

    <button (click)="saveCategory()">Guardar</button>
</div>

<div class="table-container">
    <table>
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>

        <tr *ngFor="let c of categories">
            <td>{{ c.name }}</td>
            <td>
                <button (click)="deleteCategory(c.id)">
                    Eliminar
                </button>
            </td>
        </tr>
    </table>
</div>
