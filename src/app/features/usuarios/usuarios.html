<div class="layout" [class.collapsed]="!menuOpen">
  <app-sidebar (toggle)="menuOpen = $event"></app-sidebar>

  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de usuarios</h2>

    <div class="main-grid">
      <!-- FORMULARIO -->
    <div class="form-card">
        <div class="field">
          <label>Nombre del usuario</label>
          <input [(ngModel)]="form.name" />
        </div>

        <div class="field">
          <label>Correo del usuario</label>
          <input [(ngModel)]="form.email"/>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input 
            [(ngModel)]="form.password" type="password"/>
        </div>

        <div class="field">
          <label>Rol</label>
          <select [(ngModel)]="form.roleId" class="custom-select">
            <option *ngFor="let role of roles" [value]="role.id">
              {{ role.role }}
            </option> 
          </select>
        </div>

        <button type="button" (click)="save()" [disabled]="isSaving">
          <!--{{ isSaving ? 'Guardando...' : 'Guardar' }}-->
           {{ form.id ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>

      <!-- LISTADO -->
      <div *ngIf="loading">
        Cargando usuarios...
      </div>

      <div *ngIf="!loading" class="table-container">
        <table class="product-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let p of users">
              <td>{{ p.name }}</td>
              <td>{{ p.email }}</td>
              <td>{{ p.roleName }}</td>
              <td>{{ p.active ? 'Activo' : 'Inactivo' }}</td> <!--Se muestra si esta activo o inactivo-->
              <td>
                <!--Se verifica si esta activo el usuario-->
                <button type="button" (click)="editUser(p)" class="edit">Editar</button>
                <button *ngIf="p.active" type="button" (click)="deactivateUser(p.id)" class="delete">Dar de baja</button>
                <button *ngIf="!p.active" type="button" (click)="activateUser(p.id)" class="activate">Dar de alta</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
