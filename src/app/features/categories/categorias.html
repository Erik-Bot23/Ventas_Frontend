<div class="layout" [class.collapsed]="!menuOpen">
    <app-sidebar (toggle)="menuOpen = $event"></app-sidebar>

  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de categorías</h2>

        <!--Formulario-->
        <div class="form-card">
            <div class="field">
                <label>Nombre de la categoría</label>
                <input [(ngModel)]="categoryName">
            </div>

            <button (click)="saveCategory()">Guardar</button>
        </div>

        <div class="table-container">
            <table>
                <tr>
                    <th>Categoria</th>
                    <th>Acciones</th>
                </tr>

                <tr *ngFor="let c of categories">
                    <td>{{ c.name }}</td>
                    <td>
                        <button (click)="deleteCategory(c.id)" class="delete">
                            Eliminar
                        </button>
                    </td>
                </tr>
            </table>
        </div> 
  </main>
</div>
